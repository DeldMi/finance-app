services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/prisma/prod.db
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Defina NEXTAUTH_SECRET no arquivo .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - sqlite_data:/app/prisma
      - backup_data:/bkp
    restart: unless-stopped

volumes:
  sqlite_data:
  backup_data:
