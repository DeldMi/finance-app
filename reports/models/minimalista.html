<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>{{reportTitle}}</title><style>{{styles}}</style></head>
  <body>
    <header><span class="mark">MF</span><div><p class="eyebrow">RESUMO FINANCEIRO</p><h1>{{reportTitle}}</h1><p>{{entity}} · {{generatedAt}}</p></div></header>
    <section class="totals"><article><span>Entradas</span><strong>{{totalIncome}}</strong></article><article><span>Saídas</span><strong>{{totalExpenses}}</strong></article><article><span>Saldo</span><strong>{{balance}}</strong></article></section>
    <h2>Movimentações</h2><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th>Situação</th></tr></thead><tbody>{{transactionsTable}}</tbody></table>
    <footer>Meu Financeiro <span>—</span> {{generatedAt}}</footer>
  </body>
</html>
