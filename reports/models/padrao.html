<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{reportTitle}}</title>
    <style>{{styles}}</style>
  </head>
  <body>
    <header>
      <p class="eyebrow">Meu Financeiro</p>
      <h1>{{reportTitle}}</h1>
      <p>Perfil: {{entity}} · Gerado em {{generatedAt}}</p>
    </header>
    <section class="totals">
      <article><span>Entradas pagas</span><strong>{{totalIncome}}</strong></article>
      <article><span>Despesas pagas</span><strong>{{totalExpenses}}</strong></article>
      <article><span>Saldo realizado</span><strong>{{balance}}</strong></article>
    </section>
    <h2>Movimentações</h2>
    <table>
      <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Situação</th><th>Valor</th></tr></thead>
      <tbody>{{transactionsTable}}</tbody>
    </table>
    <footer>Relatório financeiro · {{generatedAt}}</footer>
  </body>
</html>
