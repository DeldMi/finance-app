# TrueNAS SCALE 25.10: Apps > Discover Apps > Install via YAML.
# Troque POOL pelo nome real do seu pool de armazenamento.
# Gere NEXTAUTH_SECRET com: openssl rand -hex 32
services:
  app:
    image: ghcr.io/deldmi/finance-app:latest
    restart: unless-stopped
    ports:
      - "30080:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/prisma/prod.db
      FINANCE_DATABASE_DIR: /app/prisma/user-finances
      NEXTAUTH_SECRET: "TROQUE_POR_UM_SEGREDO_ALEATORIO_LONGO"
      NEXTAUTH_URL: "http://172.31.255.2:30080"
    volumes:
      - /mnt/Casa/apps/finance-app/data:/app/prisma
      - /mnt/Casa/apps/finance-app/backups:/bkp
