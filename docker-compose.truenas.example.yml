# TrueNAS SCALE 25.10: Apps > Discover Apps > Install via YAML.
# Troque POOL pelo nome real do seu pool de armazenamento.
# Gere NEXTAUTH_SECRET com: openssl rand -hex 32
services:
  app:
    image: ghcr.io/deldmi/finance-app:latest
    restart: unless-stopped
    command:
      - /bin/bash
      - -lc
      - |
        set -e
        mkdir -p /app/prisma/user-finances /app/prisma/logs /bkp
        exec > >(node ./scripts/log-tee.cjs /app/prisma/logs/application.log) 2>&1
        node ./node_modules/prisma/build/index.js migrate deploy --schema=/app/prisma-schema/schema.prisma
        exec node server.js
    ports:
      - "30080:3000"
    environment:
      NODE_ENV: production
      NEXTAUTH_SECRET: "TROQUE_POR_UM_SEGREDO_ALEATORIO_LONGO"
      NEXTAUTH_URL: "http://IP_DO_TRUENAS:30080"
    volumes:
      - /mnt/POOL/apps/finance-app/data:/app/prisma
      - /mnt/POOL/apps/finance-app/backups:/bkp
